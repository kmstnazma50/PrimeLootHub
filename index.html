<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Reward Gateway | 30 Instant Access Deals</title>
  <meta name="description" content="Access your exclusive reward collection. 30 live offers across 10 tiers. Claim and enjoy instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a1f0a, #0a0c1a, #02040f);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .content-area {
      flex: 3;
      min-width: 250px;
    }

    .level-sidebar {
      flex: 0.9;
      min-width: 200px;
      position: sticky;
      top: 2rem;
      align-self: flex-start;
      background: rgba(20, 25, 35, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      padding: 1.5rem 1rem;
      border: 1px solid rgba(251, 146, 60, 0.5);
      height: fit-content;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .level-sidebar h3 {
      color: #ffd6a5;
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .level-sidebar h3 i {
      color: #4ade80;
    }

    .triggers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .level-btn {
      background: linear-gradient(105deg, #1a1e32, #11152a);
      border: 1px solid #fb923c;
      border-radius: 60px;
      padding: 8px 0;
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: #ffdead;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .level-btn i {
      font-size: 0.75rem;
      color: #4ade80;
    }

    .level-btn:hover {
      background: linear-gradient(105deg, #2a2f4a, #1a1f38);
      border-color: #f97316;
      transform: translateY(-2px);
    }

    .level-btn.active {
      background: linear-gradient(105deg, #ea580c, #c2410c);
      border-color: #fdba74;
      color: white;
    }

    .level-btn.active i {
      color: #fef3c7;
    }

    .hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fb923c, #f97316, #4ade80, #fdba74);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    @media (max-width: 550px) {
      .hero h1 {
        font-size: 1.5rem;
        gap: 6px;
      }
      .hero h1 i {
        font-size: 1.3rem;
      }
    }
    @media (max-width: 400px) {
      .hero h1 {
        font-size: 1.2rem;
        gap: 5px;
      }
      .hero h1 i {
        font-size: 1rem;
      }
    }

    .hero h1 i {
      background: none;
      -webkit-text-fill-color: #f97316;
      font-size: 2rem;
    }

    .bottom-description {
      text-align: center;
      margin: 1rem 0 1.5rem 0;
      color: #86efac;
      font-size: 0.9rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .stats-card {
      background: rgba(10, 14, 30, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 2rem;
      margin-bottom: 0;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .total-box {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fcd9b6;
      font-weight: 600;
    }

    .total-box i {
      font-size: 2rem;
      color: #4ade80;
    }

    .total-number {
      background: #0a0e20;
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 2rem;
      font-weight: 800;
      color: #fbbf24;
      font-family: monospace;
      letter-spacing: 2px;
      border: 1px solid #4ade80;
    }

    .legend {
      display: flex;
      gap: 20px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2d3a5e;
    }

    .dot.active {
      background: #10b981;
      box-shadow: 0 0 6px #34d399;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.5rem 0 1rem 0;
      padding-bottom: 6px;
      border-bottom: 2px solid rgba(251, 146, 60, 0.5);
    }

    .section-title i {
      font-size: 1.5rem;
      color: #4ade80;
    }

    .section-title h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fee3c0;
    }

    .badge {
      background: #f97316;
      padding: 2px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #0a0a1a;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 8px;
    }

    .btn-grid::-webkit-scrollbar {
      width: 6px;
    }
    .btn-grid::-webkit-scrollbar-track {
      background: #1e253e;
      border-radius: 10px;
    }
    .btn-grid::-webkit-scrollbar-thumb {
      background: #4ade80;
      border-radius: 10px;
    }

    .offer-btn {
      background: linear-gradient(105deg, #13182e, #0c1022);
      border: 1px solid #3b3f66;
      border-radius: 60px;
      padding: 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .offer-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(105deg, #1c2340, #12172e);
      border-color: #4ade80;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .offer-btn.disabled {
      opacity: 0.7;
      cursor: not-allowed;
      pointer-events: none;
      background: linear-gradient(105deg, #1a2a1a, #0f1f0f);
      border-color: #4a6a4a;
      transform: none;
    }
    .offer-btn.disabled:hover {
      transform: none;
      box-shadow: none;
    }
    .offer-btn.disabled .click-count {
      background: #1a3a1a;
      color: #6a9e6a;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }
    .btn-left i {
      font-size: 1.2rem;
      color: #f97316;
      min-width: 28px;
      text-align: center;
    }
    .btn-left span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .click-count {
      background: #00000055;
      border-radius: 40px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #4ade80;
      border: 0.5px solid #4ade80;
      font-family: monospace;
      min-width: 50px;
      text-align: center;
    }
    .offer-btn.clicked {
      background: linear-gradient(105deg, #0f3b2a, #0a261c);
      border-color: #10b981;
    }
    .offer-btn.clicked .click-count {
      background: #064e3b;
      color: #facc15;
    }

    .reset-btn {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid #f97316;
      border-radius: 50px;
      padding: 6px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #fdba74;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .reset-btn:hover {
      background: #f9731630;
      color: #ffffff;
      border-color: #4ade80;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      color: #6b9e6b;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 850px) {
      .main-container { flex-direction: column; }
      .level-sidebar { display: none; }
      .mobile-tier-bar {
        display: block;
        background: rgba(20, 25, 35, 0.85);
        backdrop-filter: blur(16px);
        border-radius: 1.5rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(251, 146, 60, 0.5);
      }
      .mobile-tier-bar h3 {
        color: #ffd6a5;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .mobile-triggers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .mobile-tier-btn {
        background: linear-gradient(105deg, #1a1e32, #11152a);
        border: 1px solid #fb923c;
        border-radius: 60px;
        padding: 6px 0;
        font-weight: 700;
        font-size: 0.65rem;
        color: #ffdead;
        cursor: pointer;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .mobile-tier-btn i { font-size: 0.65rem; color: #4ade80; }
      .mobile-tier-btn.active {
        background: linear-gradient(105deg, #ea580c, #c2410c);
        border-color: #fdba74;
        color: white;
      }
      .btn-grid { max-height: 45vh; }
      .stats-card { margin-top: 1.5rem; }
    }
    @media (min-width: 851px) {
      .mobile-tier-bar { display: none; }
    }
  </style>
</head>
<body>
<div class="main-container">
  <div class="content-area">
    <div class="hero">
      <h1><i class="fas fa-crown"></i> REWARD GATEWAY <i class="fas fa-gem"></i></h1>
    </div>

    <div class="mobile-tier-bar" id="mobileTierBar">
      <h3><i class="fas fa-layer-group"></i> Select Your Tier</h3>
      <div class="mobile-triggers" id="mobileTriggers"></div>
    </div>

    <div class="section-title" id="dynamicSectionTitle">
      <i class="fas fa-chart-simple"></i>
      <h2 id="levelName">Tier 1 · Starter Pack</h2>
      <div class="badge" id="levelBadge">3 Offers</div>
    </div>
    <div id="offersGrid" class="btn-grid"></div>

    <div class="stats-card">
      <div class="total-box">
        <i class="fas fa-chart-line"></i>
        <span>Total Clicks</span>
        <div class="total-number" id="totalClicks">0</div>
      </div>
      <div class="legend">
        <span><i class="dot"></i> Pending</span>
        <span><i class="dot active"></i> Claimed</span>
      </div>
    </div>

    <div class="bottom-description">
      <i class="fas fa-shield-alt"></i> Discover handpicked rewards from our verified selection. Each tier features fresh offers ready to explore.
    </div>

    <footer>
      <span><i class="far fa-clock"></i> 30 Active Offers · 10 Exclusive Tiers · Instant Access</span>
      <div class="reset-btn" id="resetAllBtn"><i class="fas fa-trash-alt"></i> Reset Counters</div>
    </footer>
  </div>

  <div class="level-sidebar">
    <h3><i class="fas fa-layer-group"></i> Select Your Tier</h3>
    <div class="triggers-grid" id="desktopTriggers"></div>
  </div>
</div>

<script>
  // ========== 30 NEW t.co LINKS (as provided) ==========
  const FULL_LINKS_SET = [
    "https://t.co/pm1x9zh7q7",
    "https://t.co/jDzGO3WwCC",
    "https://t.co/AgdPqjRtNs",
    "https://t.co/txjgYz8C8g",
    "https://t.co/YiNA3T4a1y",
    "https://t.co/yAfIovkzlN",
    "https://t.co/TstidbZZCy",
    "https://t.co/FjzkYj7uRc",
    "https://t.co/s8rTiwgOJO",
    "https://t.co/9wPmej86Ur",
    "https://t.co/t8IdIPDiu1",
    "https://t.co/adtqJRm6LF",
    "https://t.co/Pkl3a8jbw2",
    "https://t.co/U5r7iO5g9J",
    "https://t.co/R3zZ16WSr3",
    "https://t.co/hOJjvT2U4Q",
    "https://t.co/qeZNoJTUUr",
    "https://t.co/EwM3rrXBoZ",
    "https://t.co/zSeLmaagHC",
    "https://t.co/I4Bnj37cu1",
    "https://t.co/FrVcdM2SUP",
    "https://t.co/k4gMoWgKSS",
    "https://t.co/xDHeddLg4m",
    "https://t.co/4bMzYSv2Av",
    "https://t.co/KNOkuT1veL",
    "https://t.co/qAuU1Qkse9",
    "https://t.co/zsANLvMweD",
    "https://t.co/F9p0Lkx6hu",
    "https://t.co/dQx9a4bNqC",
    "https://t.co/3fcxchnXS5"
  ];

  // ========== FRESH COMPLIANT OFFER NAMES (30 unique, safe, neutral yet premium) ==========
  // All names are descriptive and follow standard promotional guidelines.
  const COMPLIANT_OFFER_NAMES = [
    "✨ Digital Access Pass", "📦 Quick Start Bundle", "🎁 Surprise Reward Kit", "⚡ Instant Boost Voucher", "💎 Collector's Item",
    "🌟 Limited Edition Drop", "🏆 Achievement Unlock", "🚀 Fast Track Bonus", "🎯 Precision Offer Pack", "🔑 Insider Access Key",
    "📀 Digital Loot Box", "🕹️ Gamer Perks Pack", "🎧 Streaming Perks Bundle", "📱 Mobile Bonus Pack", "💡 Smart Reward Token",
    "🛡️ Secure Plus Vault", "📚 Info Access Pass", "🎨 Creator Bonus Kit", "⚙️ Utility Upgrade Pack", "🔔 Flash Alert Reward",
    "🌐 Web Navigator Pack", "🧩 Mystery Piece Offer", "🎵 Audio Perks Bundle", "📸 Snapshot Reward", "🕶️ Stealth Bonus Pack",
    "🍀 Lucky Spin Token", "🧭 Guided Access Pass", "🎲 Dice Roll Bonus", "🃏 Wild Reward Card", "🎈 Celebration Pack"
  ];

  // Matching icon set (FontAwesome names - all safe)
  const ICON_SET = [
    "star", "box", "gift", "bolt", "gem", "sun", "trophy", "rocket", "bullseye", "key",
    "database", "gamepad", "headphones", "mobile-alt", "lightbulb", "shield-alt", "book", "palette", "cogs", "bell",
    "globe", "puzzle-piece", "music", "camera", "sunglasses", "leaf", "compass", "dice-d6", "star-of-life", "balloon"
  ];

  // Shuffle array (Fisher-Yates)
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Persistent random ordering for each user (remix offers & names)
  function getPersistentOfferOrder() {
    const ORDER_KEY = "rewardGatewayOrderV4";
    const saved = localStorage.getItem(ORDER_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.length === 30) return parsed;
    }
    const order = Array.from({ length: 30 }, (_, i) => i);
    shuffleArray(order);
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    return order;
  }

  // Build mixed offers based on persistent shuffle
  function buildShuffledOfferList() {
    const order = getPersistentOfferOrder();
    const combined = [];
    for (let i = 0; i < 30; i++) {
      const idx = order[i];
      combined.push({
        name: COMPLIANT_OFFER_NAMES[idx % COMPLIANT_OFFER_NAMES.length],
        icon: ICON_SET[idx % ICON_SET.length],
        link: FULL_LINKS_SET[idx],
        globalId: idx
      });
    }
    return combined;
  }

  const shuffledMasterList = buildShuffledOfferList();

  // Split into 10 tiers (3 offers each)
  const TIERS_MAP = {};
  for (let tier = 1; tier <= 10; tier++) {
    TIERS_MAP[tier] = shuffledMasterList.slice((tier - 1) * 3, tier * 3);
  }

  // State management
  const TOTAL = 30;
  let clickCounts = new Array(TOTAL).fill(0);
  let claimedStatus = new Array(TOTAL).fill(false);
  const CLICKS_STORAGE = "rewardClicksV4";
  const CLAIM_STORAGE = "rewardClaimedV4";

  function loadPersistentState() {
    const savedClicks = localStorage.getItem(CLICKS_STORAGE);
    if (savedClicks) {
      try {
        const parsed = JSON.parse(savedClicks);
        if (parsed.length === TOTAL) clickCounts = parsed;
      } catch(e) {}
    }
    const savedClaim = localStorage.getItem(CLAIM_STORAGE);
    if (savedClaim) {
      try {
        const parsedClaim = JSON.parse(savedClaim);
        if (parsedClaim.length === TOTAL) claimedStatus = parsedClaim;
      } catch(e) {}
    }
  }

  function persistState() {
    localStorage.setItem(CLICKS_STORAGE, JSON.stringify(clickCounts));
    localStorage.setItem(CLAIM_STORAGE, JSON.stringify(claimedStatus));
  }

  function updateTotalDisplay() {
    const total = clickCounts.reduce((sum, val) => sum + val, 0);
    document.getElementById("totalClicks").innerText = total;
  }

  let activeTier = 1;

  function renderCurrentTier() {
    const gridContainer = document.getElementById("offersGrid");
    if (!gridContainer) return;
    gridContainer.innerHTML = "";
    const offers = TIERS_MAP[activeTier];
    const tierNamesMap = {
      1: "Starter Pack", 2: "Bronze Tier", 3: "Silver Tier", 4: "Gold Tier", 5: "Platinum Tier",
      6: "Emerald Tier", 7: "Ruby Tier", 8: "Sapphire Tier", 9: "Diamond Tier", 10: "Ultimate Vault"
    };
    const levelTitle = document.getElementById("levelName");
    const levelBadge = document.getElementById("levelBadge");
    if (levelTitle) levelTitle.innerText = `Tier ${activeTier} · ${tierNamesMap[activeTier]}`;
    if (levelBadge) levelBadge.innerText = "3 Offers";

    offers.forEach((offer) => {
      const globalIdx = offer.globalId;
      const count = clickCounts[globalIdx];
      const isClaimed = claimedStatus[globalIdx];
      const hasClick = count > 0;
      
      const btn = document.createElement("a");
      if (!isClaimed) {
        btn.href = offer.link;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
      } else {
        btn.href = "javascript:void(0);";
      }
      btn.className = `offer-btn ${hasClick ? "clicked" : ""} ${isClaimed ? "disabled" : ""}`;
      btn.setAttribute("data-global", globalIdx);
      
      btn.innerHTML = `
        <div class="btn-left">
          <i class="fas fa-${offer.icon}"></i>
          <span>${offer.name}</span>
        </div>
        <div class="click-count">${count}</div>
      `;
      
      if (!isClaimed) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (claimedStatus[globalIdx]) return false;
          
          claimedStatus[globalIdx] = true;
          clickCounts[globalIdx] += 1;
          persistState();
          updateTotalDisplay();
          renderCurrentTier();
          
          window.open(offer.link, "_blank");
          return false;
        });
      } else {
        btn.style.cursor = "not-allowed";
        btn.onclick = (e) => { e.preventDefault(); return false; };
      }
      
      gridContainer.appendChild(btn);
    });
  }

  function setActiveTier(tierNum) {
    activeTier = tierNum;
    document.querySelectorAll(".level-btn").forEach(btn => {
      const val = parseInt(btn.getAttribute("data-level"));
      if (val === tierNum) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    document.querySelectorAll(".mobile-tier-btn").forEach(btn => {
      const val = parseInt(btn.getAttribute("data-level"));
      if (val === tierNum) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    renderCurrentTier();
  }

  function resetAllCountersAndClaims() {
    for (let i = 0; i < TOTAL; i++) {
      clickCounts[i] = 0;
      claimedStatus[i] = false;
    }
    persistState();
    updateTotalDisplay();
    renderCurrentTier();
  }

  function buildTierTriggers() {
    const desktopContainer = document.getElementById("desktopTriggers");
    const mobileContainer = document.getElementById("mobileTriggers");
    if (!desktopContainer || !mobileContainer) return;
    desktopContainer.innerHTML = "";
    mobileContainer.innerHTML = "";
    
    for (let i = 1; i <= 10; i++) {
      const dBtn = document.createElement("div");
      dBtn.className = "level-btn";
      dBtn.setAttribute("data-level", i);
      dBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      dBtn.addEventListener("click", (e) => {
        e.preventDefault();
        setActiveTier(i);
      });
      desktopContainer.appendChild(dBtn);
      
      const mBtn = document.createElement("div");
      mBtn.className = "mobile-tier-btn";
      mBtn.setAttribute("data-level", i);
      mBtn.innerHTML = `<i class="fas fa-tag"></i> ${i}`;
      mBtn.addEventListener("click", (e) => {
        e.preventDefault();
        setActiveTier(i);
      });
      mobileContainer.appendChild(mBtn);
    }
  }

  loadPersistentState();
  buildTierTriggers();
  setActiveTier(1);
  updateTotalDisplay();
  
  const resetBtn = document.getElementById("resetAllBtn");
  if (resetBtn) resetBtn.addEventListener("click", resetAllCountersAndClaims);
</script>
</body>
